# Production layer set (commercial) -- TYPE layer (commercial). A patch over the composed base.
# Pins the commercial character: permitted use is required and defaulted to commercial, so a generated
# draft always carries a commercial use covenant even when the aggregate does not supply it (the
# default satisfies generate's required-check, preserving preview/draft parity).
meta:
  kind: type
  dimensions: { type: commercial }
  version: 1

ops:
  - { op: overrideField, key: permittedUse, required: true, default: commercial }
