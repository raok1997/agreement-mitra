# Production layer set (commercial) -- STATE layer (Telangana). A patch over the composed template
# that adds Telangana's statutory overlay for commercial leases: governing law (Transfer of Property
# Act 1882 / Registration Act 1908), stamping / compulsory registration before the jurisdictional
# Sub-Registrar, and who bears the registration charges. Added as one small state layer over the
# shared national commercial base -- no per-state copy of the whole agreement.
meta:
  kind: state
  dimensions: { state: TG }
  # v2 (2026-09-17): stampDutyAmount became system-sourced (filled from the attached e-stamp
  # certificate at stamp intake), so a deed never prints its blank row.
  version: 2

ops:
  # SYSTEM-SOURCED (2026-09-17, stamp-duty-amount-from-certificate). The customer cannot know the
  # duty -- it is fixed by the certificate staff buy after payment -- and a typed amount could
  # contradict the certificate bound into the same file. So the capture form never shows it, a
  # submitted value is discarded, and stamp intake re-renders the deed with the certificate's
  # duty amount. Until then the draft the parties review (emailed before payment) shows the row
  # with a visible provision, "[ Provision for stamp duty ]"; tgStampAmount stays out until stamped.
  - { op: addField,
      field: { key: stampDutyAmount, label: "Stamp duty paid (INR)", type: money, required: false,
               source: system, placeholder: "Provision for stamp duty" } }
  - { op: addField,
      field: { key: registrationChargesBorneBy, label: "Registration charges borne by", type: enum,
               required: false, default: lessee, options: [ lessor, lessee, shared ] } }

  - { op: addClause,
      clause: { id: tgGoverningLaw,
                text: "This Agreement shall be governed by the laws of India as applicable in the State
                       of Telangana, including the Transfer of Property Act, 1882 and the Registration
                       Act, 1908, as amended." } }
  - { op: addClause,
      clause: { id: tgStampRegistration,
                text: "This Agreement shall be duly stamped and, where the term exceeds eleven (11)
                       months, compulsorily registered before the jurisdictional Sub-Registrar in the
                       State of Telangana under the Registration Act, 1908. The stamp duty and
                       registration charges shall be borne by the {{registrationChargesBorneBy}}." } }
  - { op: addClause,
      clause: { id: tgStampAmount, showWhen: "stampDutyAmount > 0",
                text: "The stamp duty paid on this Agreement is INR {{stampDutyAmount}}." } }

  # Optional/opt-in, matching the residential decision: the Telangana statutory overlay is an add-on
  # the user adds from the catalog, absent from preview + signed draft until added.
  - { op: addSection,
      section: { title: "Statutory (Telangana)", optional: true,
                 entries: [ stampDutyAmount, registrationChargesBorneBy,
                            tgGoverningLaw, tgStampRegistration, tgStampAmount ] } }
