# Production layer set (rental) -- STATE layer (Karnataka). A patch over the composed template that
# adds Karnataka's statutory overlay: governing tenancy law, stamping under the Karnataka Stamp Act
# 1957 and registration before the jurisdictional Sub-Registrar, and who bears those charges. One
# small state layer over the shared national base -- no per-state copy of the whole agreement.
#
# MANDATORY, not opt-in (`optional: false`), and that is a correctness requirement rather than a
# preference. The Karnataka state_type layer beside this file removes the national
# `stampRegistrationClause` on the ground that `kaStampRegistration` supersedes it. If this section
# were opt-in, a default Karnataka deed would render with NO stamp or registration clause at all --
# which is exactly the hole Telangana shipped with between 2026-07-13 and 2026-09-07, and which the
# Telangana COMMERCIAL set still carries. If this is ever flipped to `optional: true`, restore
# `stampRegistrationClause` to the witnesseth list in the same edit or the hole reopens.
#
# stampDutyAmount is SYSTEM-SOURCED, matching the Telangana v3 treatment: the customer cannot know
# the duty (it is fixed by the certificate bought after payment), and a typed amount could contradict
# the certificate bound into the same file. So the capture form never shows it, a submitted value is
# discarded, and stamp intake re-renders the deed with the certificate's amount. Until then the draft
# shows the row with a visible provision; kaStampAmount stays out until stamped.
meta:
  kind: state
  dimensions: { state: KA }
  # v2 (2026-10-09): who bears the stamp duty and registration charges became two option-gated clauses.
  # `shared` rendered "borne by the Shared"; it now reads "shared equally between the Owner and the
  # Tenant". Bumped because every deed's statutory section changes.
  version: 2

ops:
  - { op: addField,
      field: { key: stampDutyAmount, label: "Stamp duty paid (INR)", type: money, required: false,
               source: system, placeholder: "Provision for stamp duty" } }
  - { op: addField,
      field: { key: registrationChargesBorneBy, label: "Registration charges borne by", type: enum,
               required: false, default: tenant, options: [ owner, tenant, shared ] } }

  # The Karnataka Rent Act, 1999 is the state's rent-control statute; "where applicable" is deliberate
  # and not hedging -- the Act exempts premises by rent threshold and by date of construction, so a
  # flat assertion that it governs every tenancy would be wrong for a large share of Bengaluru lets.
  # Whether to name it at all, and in what terms, is with counsel (see the design's open questions).
  - { op: addClause,
      clause: { id: kaGoverningLaw,
                text: "This Agreement shall be governed by the laws of India and the tenancy laws
                       applicable in the State of Karnataka, including, where applicable, the
                       Karnataka Rent Act, 1999, as amended." } }
  # The clause states NO registration threshold: "where the law requires it". The threshold lives
  # only in rules/stamp-duty/<state>/*.yaml (`requiredWhenTermMonthsOver`), which drives the
  # registration notice on the stamp quote, so the deed can never contradict it (decided
  # 2026-10-07, after the Telangana clause had drifted to "eleven months" against a rule of 0).
  - { op: addClause,
      clause: { id: kaStampRegistration,
                text: "This Agreement shall be duly stamped under the Karnataka Stamp Act, 1957 and,
                       where the law requires it, registered before the jurisdictional Sub-Registrar
                       in the State of Karnataka under the Registration Act, 1908." } }
  # Who bears the charges is two option-gated clauses, not one "borne by the {{...}}" slot: the
  # slot renders the option label, so `shared` printed "borne by the Shared" and never said how.
  - { op: addClause,
      clause: { id: kaRegistrationChargesBorneBy,
                showWhen: "registrationChargesBorneBy == \"owner\" || registrationChargesBorneBy == \"tenant\"",
                text: "The stamp duty and registration charges shall be borne by the
                       {{registrationChargesBorneBy}}." } }
  - { op: addClause,
      clause: { id: kaRegistrationChargesShared, showWhen: "registrationChargesBorneBy == \"shared\"",
                text: "The stamp duty and registration charges shall be shared equally between the
                       Owner and the Tenant." } }
  - { op: addClause,
      clause: { id: kaStampAmount, showWhen: "stampDutyAmount > 0",
                text: "The stamp duty paid on this Agreement is INR {{stampDutyAmount}}." } }
  - { op: addClause,
      clause: { id: kaEssentialServices,
                text: "The Owner shall not withhold, disconnect or cause to be disconnected any
                       essential supply or service to the Premises, including water and electricity,
                       during the subsistence of this Agreement." } }

  # Render kind unset, which defaults to KEYVALUE -- safe for this section's mixed entries, as the
  # compiler emits a <table class="kv"> for the two fields and switches to <ol class="clauses"> for
  # the four clauses (the same shape the Telangana statutory section relies on).
  - { op: addSection,
      section: { title: "Statutory (Karnataka)", optional: false,
                 entries: [ stampDutyAmount, registrationChargesBorneBy,
                            kaGoverningLaw, kaStampRegistration, kaRegistrationChargesBorneBy,
                            kaRegistrationChargesShared, kaStampAmount,
                            kaEssentialServices ] } }
