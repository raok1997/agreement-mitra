# Production layer set (rental) -- STATE layer (Telangana). A patch over the composed template that
# adds Telangana's statutory overlay: governing tenancy law, stamping / registration before the
# jurisdictional Sub-Registrar, and who bears the registration charges. Added as one small state
# layer over the shared national base -- no per-state copy of the whole agreement.
meta:
  kind: state
  dimensions: { state: TG }
  # v2 (2026-09-07): "Statutory (Telangana)" flipped opt-in -> mandatory. Bumped because agreements
  # already generated pin `state:TG: 1` and were rendered from the OPT-IN content; leaving the
  # version at 1 would make two materially different Telangana deeds report the same authored
  # version, and the pin (Agreement.pinEffectiveTemplate) exists precisely to keep that answerable.
  version: 2

ops:
  - { op: addField,
      field: { key: stampDutyAmount, label: "Stamp duty paid (INR)", type: money, required: false } }
  - { op: addField,
      field: { key: registrationChargesBorneBy, label: "Registration charges borne by", type: enum,
               required: false, default: tenant, options: [ owner, tenant, shared ] } }

  - { op: addClause,
      clause: { id: tgGoverningLaw,
                text: "This Agreement shall be governed by the laws of India and the tenancy laws
                       applicable in the State of Telangana, including the Telangana Buildings (Lease,
                       Rent and Eviction) Control Act, 1960, as amended." } }
  - { op: addClause,
      clause: { id: tgStampRegistration,
                text: "This Agreement shall be duly stamped and, where the term exceeds eleven (11)
                       months, compulsorily registered before the jurisdictional Sub-Registrar in the
                       State of Telangana under the Registration Act, 1908. The stamp duty and
                       registration charges shall be borne by the {{registrationChargesBorneBy}}." } }
  - { op: addClause,
      clause: { id: tgStampAmount, showWhen: "stampDutyAmount > 0",
                text: "The stamp duty paid on this Agreement is INR {{stampDutyAmount}}." } }
  - { op: addClause,
      clause: { id: tgEssentialServices,
                text: "In accordance with the tenancy law applicable in Telangana, the Owner shall not
                       withhold or disconnect essential supplies or services (including water and
                       electricity) to the Premises during the subsistence of this Agreement." } }

  # MANDATORY (2026-09-07). This reverses the 2026-07-13 opt-in decision, and the reason is NOT the
  # one recorded in the old tasks.md note (the deferred-active-set risk) -- it is a concrete hole:
  # the TG residential layer re-authors the witnesseth list WITHOUT the national
  # `stampRegistrationClause` (see state_type-TG-residential.patch.yaml), so with this section opt-in
  # a Telangana deed rendered with NO stamp/registration clause at all, while every national deed
  # carries one. Telangana -- the one state with a bespoke layer -- shipped strictly worse than the
  # default template. Making the section mandatory restores the clause and, with it, the TG tenancy
  # law reference (tgGoverningLaw) and the essential-services protection (tgEssentialServices).
  #
  # Costs the user no input: both fields are `required: false`, and tgStampAmount is gated
  # `showWhen: stampDutyAmount > 0`, so no empty amount ever renders. Render kind is unset, which
  # defaults to KEYVALUE -- verified safe for this section's mixed entries: TemplateCompiler's
  # appendKeyValueBody emits a <table class="kv"> for the two fields and switches to
  # <ol class="clauses"> for the four clauses.
  #
  # STILL PENDING LEGAL SIGN-OFF (rental-document-content-v2 task 9.4). Flip back to `optional: true`
  # only if counsel says the overlay is genuinely opt-in -- and if so, restore
  # `stampRegistrationClause` to the TG witnesseth list in the same edit, or the hole returns.
  - { op: addSection,
      section: { title: "Statutory (Telangana)", optional: false,
                 entries: [ stampDutyAmount, registrationChargesBorneBy,
                            tgGoverningLaw, tgStampRegistration, tgStampAmount, tgEssentialServices ] } }
