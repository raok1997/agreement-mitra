# Activated with: SPRING_PROFILES_ACTIVE=local
# Convenience defaults for local docker-compose infra.
#
# No schema override here by design: since the persistence-foundation CR, Flyway owns the
# schema in every environment (local/test/prod) and JPA stays ddl-auto: validate (set in
# application.yml). Local schema comes from compose Postgres + Flyway on `bootRun`. If a prior
# ddl-auto: update run left a dirty local schema, drop/recreate the DB (or the compose volume)
# so Flyway starts clean. Add local-only overrides below as the app grows.
spring:
  flyway:
    enabled: true

# Dummy sandbox Google client so the app boots locally without real credentials (login stays
# optional -- anonymous drafting needs none). A real local login needs real sandbox creds via
# GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_SECRET. These are non-blank placeholders only; they satisfy
# the fail-fast check and are NOT real secrets.
auth:
  google:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:local-dummy}
    client-secret: ${GOOGLE_OAUTH_SECRET:dummy}

# Local dev charges on the shipped Telangana stamp duty rules even though they carry no counsel review
# yet (state-stamp-duty-quoting). Startup logs a WARN naming them. Never copy this to a real deployment.
rules:
  stamp-duty:
    allow-unreviewed: ${RULES_STAMP_DUTY_ALLOW_UNREVIEWED:true}
