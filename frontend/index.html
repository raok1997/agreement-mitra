<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The recovery link we email carries the agreement id in its path, and the agreement id is a
         bearer capability. Without this, clicking any outbound link from that page would hand the
         id to a third-party origin in the Referer header. same-origin keeps referrers internal;
         cross-origin requests send none at all. -->
    <meta name="referrer" content="same-origin" />

    <title>AgreementMitra | Online Rental Agreement with Aadhaar eSign, Hyderabad</title>
    <meta
      name="description"
      content="Build an Indian rental agreement online in minutes. Live document preview, state-wise stamp duty shown up front, and remote Aadhaar OTP eSign. Free to draft, no login to start."
    />
    <link rel="canonical" href="https://agreementmitra.com/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#313984" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AgreementMitra" />
    <meta property="og:url" content="https://agreementmitra.com/" />
    <meta
      property="og:title"
      content="AgreementMitra | Online Rental Agreement with Aadhaar eSign"
    />
    <meta
      property="og:description"
      content="Build an Indian rental agreement online in minutes. Live document preview, state-wise stamp duty shown up front, and remote Aadhaar OTP eSign. Free to draft."
    />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Structured data for the marketing page. Crawlers read this out of the static HTML,
      which is why it lives here rather than being injected by the SPA.

      MAINTENANCE: the questions/answers below mirror the `faqs` array in
      src/views/LandingPage.vue, and LandingPage.test.ts asserts the two stay in step. Google
      devalues FAQ markup that does not match the visible page, so change both together.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://agreementmitra.com/#org",
            "name": "AgreementMitra",
            "url": "https://agreementmitra.com/",
            "email": "support@agreementmitra.com",
            "areaServed": { "@type": "Place", "name": "Hyderabad, Telangana, India" },
            "description": "Online rental agreement platform for India with Aadhaar OTP eSign."
          },
          {
            "@type": "WebSite",
            "@id": "https://agreementmitra.com/#site",
            "url": "https://agreementmitra.com/",
            "name": "AgreementMitra",
            "publisher": { "@id": "https://agreementmitra.com/#org" },
            "inLanguage": "en-IN"
          },
          {
            "@type": "FAQPage",
            "@id": "https://agreementmitra.com/#faq",
            "isPartOf": { "@id": "https://agreementmitra.com/#site" },
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Why are most rental agreements in India for 11 months?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Because the Registration Act, 1908 requires a lease for a term longer than a year to be registered with the sub-registrar, and an 11-month term stays under that national line. States can add their own rules, and some may require registration for shorter leases. Before you pay, we show whether your agreement may need registering for its state and term. Registration is a separate step from stamping and is not part of our service."
                }
              },
              {
                "@type": "Question",
                "name": "Is an Aadhaar OTP signature legally valid?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Aadhaar eSign is an electronic signature recognised under the Information Technology Act, 2000, issued through a licensed eSign Service Provider working with a Certifying Authority. The signed PDF carries a digital signature certificate and an audit trail recording who signed, when, and from where."
                }
              },
              {
                "@type": "Question",
                "name": "What does it cost?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "₹499 in total when the stamp duty on your agreement is ₹100 or less. Where the duty is higher, you see the stamp amount and the exact total before you pay, and there is never a second bill. Stamp duty is set by your state from the rent, deposit and term, and we cannot change it."
                }
              },
              {
                "@type": "Question",
                "name": "Does a stamped agreement mean it is registered?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Stamping pays the state's duty on the document. Registration is a separate act of recording the lease with the sub-registrar. A stamped, eSigned agreement is not a registered lease."
                }
              },
              {
                "@type": "Question",
                "name": "Do I need an account?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Not to build and preview an agreement. You only need to sign in if you want to save a draft, leave, and pick it up later, or keep a list of your past agreements."
                }
              },
              {
                "@type": "Question",
                "name": "Which cities do you serve?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "You can draft residential rental agreements for Telangana and Karnataka. Where we can also stamp and eSign is on the status board on our home page. If your state is not listed, write to us."
                }
              },
              {
                "@type": "Question",
                "name": "What happens if something goes wrong?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "The guarantees on our home page cover the main things that can go wrong on our side: a wrong stamp certificate, a failed signature and a late delivery. For anything else, write to support@agreementmitra.com. We answer 9am to 5pm IST on working days."
                }
              }
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
