# Local dev infra only. Not for production.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: agreementmitra
      POSTGRES_USER: agreementmitra
      POSTGRES_PASSWORD: agreementmitra
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  minio:
    # Pinned to the SAME release the Testcontainers harness uses (HarnessTestConfig), so the dev
    # stack and the test suite run one MinIO. `latest` drifted to RELEASE.2025-09-07, which no longer
    # answers minio-java 8.6.0's bucket calls with XML: every stored-draft request 500'd locally
    # ("Failed to ensure bucket agreements") while the suite stayed green on its own pinned image.
    # Bump this and the harness pin together, and bump minio-java deliberately alongside them.
    image: minio/minio:RELEASE.2023-09-04T19-57-37Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  # Document rendering (CR-3a): headless Chromium HTML->PDF via Gotenberg (thin image with
  # bundled Noto fonts). The app is a plain HTTP client at GOTENBERG_URL -- no browser binary
  # in the app. Chromium's outbound network is denied (SSRF/exfil guard): both private and
  # public IPs are refused, and Gotenberg's default deny-list already blocks file:// outside
  # /tmp. The render loads only the self-contained HTML the app uploads.
  gotenberg:
    build: ./docker/gotenberg
    environment:
      CHROMIUM_DENY_PUBLIC_IPS: "true"
      CHROMIUM_DENY_PRIVATE_IPS: "true"
    ports: ["3000:3000"]

volumes:
  pgdata:
  miniodata:
